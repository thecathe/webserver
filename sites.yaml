# The ddm site spec (v2). Reference: docs/usage/spec.md.
# Check it with:  nix develop -c bin/ddm check
#
# Not live yet: ddm validates this spec and builds sites locally
# (bin/ddm build <site>), but publishes nothing until M3.

system:
  flake: github:cathe-org/dots   # becomes the personal-account repo after the transfer
  host: droplet                  # nixosConfigurations.droplet, written in M5
  poll: 10m

domains: [cathe.dev, jpears.me]

# Private mounts (access: private) live here and only here: the.cathe.dev and
# its subdomains point at the server's tailnet address, and are served only to
# your Tailscale identity.
private_domain: the.cathe.dev

taxa: [docs, personal, work, project, tool, demo, media, presentation, resource, blog, notes]

workflows:
  # A forest built with the forester fork, in the forest repo's own devShell.
  # build-forest (from vscode-forester) runs forest_gen.py, forester build,
  # copies assets and post-processes SVGs. --strict-private fails the build if
  # a visible tree links to a hidden one, so a non-private view fails closed.
  forester:
    root_only: true   # links are root-absolute (base-url="/"): mount at / only
    env: { flake: "{{repo}}" }
    params: { config: forest.toml }
    steps:
      - run: build-forest {{config}} --strict-private
        unless: { view: private }
      - run: build-forest {{config}}
        when: { view: private }
      - output: output/

  mkdocs:
    env: { flake: "{{system}}#mkdocs" }
    params: { input_dir: docs, theme: material }
    steps:
      - builtin: mkdocs-config
      - run: mkdocs build -d {{out}}

  # dune + odoc + the OCaml libraries our projects use, from this repo's flake.
  odoc:
    env: { flake: "{{system}}#ocaml-docs" }
    steps:
      - run: dune build @doc
      - output: _build/default/_doc/_html

  # Every OCaml project's API docs, built together in one dune workspace so
  # odoc links across projects (a type from a shared library links to its
  # docs). pool: true runs this once for all sites that use it, and serves the
  # one result from all of their mounts. Tools come from one opam switch
  # (scripts/opam-pool-switch.sh), cached between builds: the projects' own
  # lockfiles if they agree, else one solve over their .opam constraints.
  odoc-pool:
    pool: true
    env: { flake: "{{system}}#ocaml-opam" }
    steps:
      - run: sh {{system}}/scripts/opam-pool-switch.sh {{cache}} {{repo}}
      - run: OPAMROOT={{cache}}/opam-root opam exec --switch={{cache}}/switch -- dune build @doc --profile release
      - output: _build/default/_doc/_html

  # .ml files with doc comments → markdown → mkdocs (was demos-deploy-docs.yml).
  ocaml-notebook:
    env: { flake: "{{system}}#mkdocs" }
    params: { ml_dir: lib }
    steps:
      - run: >-
          mkdir -p docs &&
          find {{ml_dir}} -name "*.ml" -print0 | xargs -0 python3 {{system}}/scripts/generate_docs.py -o docs/ &&
          { [ -f docs/index.md ] || echo "# {{site}}" > docs/index.md; }
      - use: mkdocs

  # A repo that already is a static site.
  static:
    params: { input_dir: ./ }
    steps:
      - output: "{{input_dir}}"

  # Pages generated from this spec: the public directory (page: directory)
  # or the private site map of every mount (page: map), plus the 404 page.
  site-directory:
    params: { page: directory }
    steps:
      - builtin: site-directory

sites:
  forest:
    repo: thecathe/forest
    taxa: [personal, notes]
    description: Notes, profile, CV, posts and papers
    # Until M4 adds per-view configs (forest.<view>.toml generated from the
    # forest's site.yaml), every view builds from forest.toml; only the
    # private view skips --strict-private.
    views:
      public:  { workflow: forester }
      notes:   { workflow: forester }
      private: { workflow: forester }
    # The first mount of a view is its canonical address: site://forest/...
    # links resolve to forest.cathe.dev.
    mounts:
      - { host: forest.cathe.dev, entry: /index/ }
      - { host: cathe.dev, entry: /@cathe/ }
      - { host: jpears.me, entry: /@jpears/ }
      - { host: projects.cathe.dev, entry: /taxon-project/ }
      - { host: indimo.cathe.dev, entry: /indimo/ }
      - { host: mebi.cathe.dev, entry: /mebi/ }
      - { host: notes.cathe.dev, view: notes, entry: /index/ }
      - { host: the.cathe.dev, view: private, entry: /index/, access: private }

  docs:
    indexed: false
    views:
      public:  { workflow: site-directory }
      private: { workflow: site-directory, params: { page: map } }
    mounts:
      - { host: docs.cathe.dev }
      # The full site map: every site, host and mount, public and private.
      - { host: the.cathe.dev, path: sites, view: private, access: private }

  ddm:
    repo: cathe-org/dots
    workflow: mkdocs
    taxa: [docs, project, tool]
    description: Design and usage docs for ddm, the deployment manager behind these sites
    mounts: [ { host: ddm.cathe.dev } ]

  # The OCaml docs pool. `ocaml` has no repo: it serves the pooled build's
  # root, odoc's list of every package, as the collated OCaml docs page.
  ocaml:
    workflow: odoc-pool
    taxa: [docs]
    description: API documentation for every OCaml package, linked together
    mounts: [ { host: ocaml.cathe.dev } ]

  cloakaml:
    repo: thecathe/cloakaml
    branch: docs   # the branch its old docs Action deployed from
    workflow: odoc-pool
    taxa: [docs, project, tool]
    description: cloakaml API documentation
    # Lands on the package rather than odoc's package list.
    mounts: [ { host: cloakaml.cathe.dev, entry: /cloakaml/ } ]

  # Pool members without an address of their own: their docs are at
  # ocaml.cathe.dev/<package>/ (mebi.cathe.dev is the forest's mebi page).
  mebi-plugin:
    repo: thecathe/mebi_plugin
    workflow: odoc-pool
    taxa: [docs, project, tool]
    description: MEBI, a Rocq plugin for mechanised bisimilarity proofs (API documentation)

  # Out of the pool for now: membranes needs dune >= 3.24 (its lang dune
  # 3.24), while Rocq 9.2.0 (mebi-plugin) needs dune < 3.24, so no switch can
  # build both. Lowering membranes to (lang dune 3.23) would let it in.
  # membranes:
  #   repo: thecathe/membranes
  #   branch: re-functoring
  #   workflow: odoc-pool
  #   taxa: [docs, project]
  #   description: membranes API documentation

  demos:
    repo: thecathe/demos
    workflow: ocaml-notebook
    params: { ml_dir: ocaml }
    taxa: [demo, project]
    description: OCaml demos, rendered from their doc comments
    mounts: [ { host: demos.cathe.dev } ]

  # INDIMO's notes in mkdocs, until they move into the forest (whose INDIMO
  # page is indimo.cathe.dev). Also the sample of a plain-markdown site.
  indimo-notes:
    repo: thecathe/INDIMO
    workflow: mkdocs
    taxa: [notes]
    description: INDIMO project notes
    mounts: [ { host: indimo-notes.cathe.dev } ]
